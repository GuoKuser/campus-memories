<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4eadb">
  <meta name="description" content="一册关于校园时光、相遇与告别的私人影像集。">
  <title>未完待续 · 校园回忆相册</title>
  <style>
    :root {
      --paper: #f4eadb;
      --paper-deep: #e9dac4;
      --ink: #26302c;
      --muted: #6f756f;
      --green: #335c4a;
      --orange: #dc7450;
      --white: #fffdf8;
      --shadow: 0 18px 55px rgba(42, 48, 43, .15);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: linear-gradient(rgba(244,234,219,.92), rgba(244,234,219,.92)), url("assets/paper-texture.jpg");
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    button, a { font: inherit; }
    button { color: inherit; }

    .hero {
      min-height: 92vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 560px);
      align-items: center;
      gap: clamp(2rem, 8vw, 8rem);
      max-width: 1320px;
      margin: auto;
      padding: clamp(2rem, 7vw, 7rem) clamp(1.25rem, 5vw, 5rem);
      overflow: hidden;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      margin: 0 0 1.25rem;
      color: var(--green);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 32px; height: 2px; background: var(--orange); }
    h1 {
      max-width: 720px;
      margin: 0;
      font-family: Georgia, "STSong", serif;
      font-size: clamp(4rem, 10vw, 8.5rem);
      font-weight: 500;
      letter-spacing: -.07em;
      line-height: .9;
    }
    h1 em { color: var(--orange); font-style: normal; }
    .intro {
      max-width: 580px;
      margin: 2rem 0 2.25rem;
      color: var(--muted);
      font-size: clamp(1rem, 1.6vw, 1.18rem);
      line-height: 1.9;
    }
    .hero-link {
      display: inline-flex;
      align-items: center;
      gap: .7rem;
      color: var(--ink);
      text-decoration: none;
      font-weight: 800;
      border-bottom: 2px solid var(--orange);
      padding-bottom: .35rem;
    }
    .hero-link span { transition: transform .2s ease; }
    .hero-link:hover span { transform: translateY(4px); }

    .hero-photo {
      position: relative;
      transform: rotate(2.5deg);
      padding: clamp(.8rem, 1.5vw, 1.2rem) clamp(.8rem, 1.5vw, 1.2rem) clamp(3.2rem, 5vw, 4.8rem);
      background: var(--white);
      box-shadow: var(--shadow);
    }
    .hero-photo::before {
      content: "";
      position: absolute;
      top: -22px;
      left: 42%;
      width: 105px;
      height: 42px;
      background: rgba(233, 190, 114, .72);
      transform: rotate(-5deg);
      z-index: 2;
    }
    .hero-photo img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
    .scribble {
      position: absolute;
      right: 1.6rem;
      bottom: 1.2rem;
      font-family: "Segoe Print", "KaiTi", cursive;
      color: var(--green);
      font-size: clamp(1rem, 2vw, 1.45rem);
      transform: rotate(-3deg);
    }

    main { padding: 1rem clamp(1rem, 4vw, 4rem) 6rem; }
    .gallery-head {
      max-width: 1240px;
      margin: 0 auto 2.2rem;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1.5rem;
      border-top: 1px solid rgba(38,48,44,.22);
      padding-top: 2rem;
    }
    .gallery-head h2 {
      margin: 0;
      font-family: Georgia, "STSong", serif;
      font-size: clamp(2.2rem, 5vw, 4.4rem);
      font-weight: 500;
    }
    .gallery-count { margin: .45rem 0 0; color: var(--muted); }
    .filters { display: flex; gap: .55rem; flex-wrap: wrap; justify-content: flex-end; }
    .filter {
      cursor: pointer;
      border: 1px solid rgba(38,48,44,.25);
      border-radius: 999px;
      background: transparent;
      padding: .62rem 1rem;
      transition: .2s ease;
    }
    .filter:hover, .filter.active { background: var(--ink); border-color: var(--ink); color: var(--white); }

    .gallery {
      max-width: 1240px;
      margin: auto;
      columns: 4 260px;
      column-gap: 1.15rem;
    }
    .card {
      position: relative;
      width: 100%;
      display: inline-block;
      margin: 0 0 1.15rem;
      break-inside: avoid;
      cursor: zoom-in;
      border: 0;
      padding: 0;
      background: var(--white);
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(40,48,43,.09);
      text-align: left;
    }
    .card[hidden] { display: none; }
    .card img, .card video {
      display: block;
      width: 100%;
      height: auto;
      min-height: 180px;
      max-height: 520px;
      object-fit: cover;
      background: #ded9ce;
      transition: transform .5s cubic-bezier(.2,.7,.2,1), filter .3s ease;
    }
    .card:hover img, .card:hover video { transform: scale(1.025); filter: saturate(1.08); }
    .card-meta {
      position: absolute;
      inset: auto 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 2.5rem 1rem .85rem;
      color: white;
      background: linear-gradient(transparent, rgba(15,21,18,.78));
      font-size: .82rem;
      opacity: 0;
      transform: translateY(8px);
      transition: .25s ease;
    }
    .card:hover .card-meta, .card:focus-visible .card-meta { opacity: 1; transform: none; }
    .kind { font-weight: 800; letter-spacing: .08em; }
    .play {
      position: absolute;
      top: 50%; left: 50%;
      width: 58px; height: 58px;
      display: grid; place-items: center;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      color: white;
      background: rgba(24,32,28,.72);
      backdrop-filter: blur(8px);
      font-size: 1.2rem;
      pointer-events: none;
    }

    .note {
      max-width: 820px;
      margin: 6rem auto 2rem;
      text-align: center;
    }
    .note p:first-child { color: var(--orange); font-size: 2rem; margin: 0; }
    .note blockquote {
      margin: 1.2rem 0;
      font-family: Georgia, "STSong", serif;
      font-size: clamp(1.5rem, 3.5vw, 2.8rem);
      line-height: 1.5;
    }
    .note small { color: var(--muted); letter-spacing: .12em; }
    footer {
      max-width: 1240px;
      margin: auto;
      padding: 2rem 0 0;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      border-top: 1px solid rgba(38,48,44,.22);
      color: var(--muted);
      font-size: .82rem;
    }

    dialog {
      width: 100vw;
      max-width: none;
      height: 100vh;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: rgba(17, 22, 19, .95);
      color: white;
    }
    dialog::backdrop { background: rgba(17,22,19,.95); }
    .viewer { height: 100%; display: grid; place-items: center; padding: 4.5rem 5rem; }
    .viewer img, .viewer video { max-width: 100%; max-height: calc(100vh - 9rem); object-fit: contain; box-shadow: 0 15px 65px rgba(0,0,0,.35); }
    .viewer-close, .nav {
      position: fixed;
      z-index: 3;
      display: grid;
      place-items: center;
      width: 48px; height: 48px;
      border: 1px solid rgba(255,255,255,.32);
      border-radius: 50%;
      color: white;
      background: rgba(255,255,255,.08);
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .viewer-close { top: 1rem; right: 1rem; font-size: 1.6rem; }
    .nav { top: 50%; transform: translateY(-50%); font-size: 1.6rem; }
    .prev { left: 1rem; }
    .next { right: 1rem; }
    .viewer-info { position: fixed; left: 1.2rem; bottom: 1rem; color: rgba(255,255,255,.72); font-size: .85rem; }

    :focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
    @media (max-width: 800px) {
      .hero { min-height: auto; grid-template-columns: 1fr; padding-top: 5rem; }
      .hero-photo { width: min(86%, 520px); margin: 0 auto; }
      .gallery-head { align-items: flex-start; flex-direction: column; }
      .filters { justify-content: flex-start; }
      .card-meta { opacity: 1; transform: none; }
      .viewer { padding: 4rem .5rem; }
      .nav { top: auto; bottom: 4rem; }
      footer { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">Campus Memory · 2026</p>
      <h1>未完<br><em>待续</em></h1>
      <p class="intro">把笑声、晴天和那些来不及认真告别的瞬间，装进这一页。后来我们奔向不同的远方，但故事一直留在这里。</p>
      <a class="hero-link" href="#album">翻开相册 <span aria-hidden="true">↓</span></a>
    </div>
    <figure class="hero-photo">
      <img src="assets/photo-01.jpg" alt="暖色天空下通往远方的道路">
      <figcaption class="scribble">那年夏天，风正好。</figcaption>
    </figure>
  </header>

  <main id="album">
    <section class="gallery-head" aria-labelledby="gallery-title">
      <div>
        <h2 id="gallery-title">我们的片段</h2>
        <p class="gallery-count"><span id="visible-count">31</span> 个瞬间 · 点击查看</p>
      </div>
      <div class="filters" aria-label="筛选相册">
        <button class="filter active" type="button" data-filter="all">全部</button>
        <button class="filter" type="button" data-filter="photo">照片</button>
        <button class="filter" type="button" data-filter="video">视频</button>
      </div>
    </section>

    <section class="gallery" id="gallery" aria-label="校园回忆相册"></section>

    <section class="note" aria-label="结束语">
      <p aria-hidden="true">✦</p>
      <blockquote>“青春不是一段时光，而是所有人散场之后，仍会忽然想起的那阵风。”</blockquote>
      <small>TO BE CONTINUED · 2026</small>
    </section>

    <footer>
      <span>校园回忆相册</span>
      <span>愿我们跃入人海，各有灿烂。</span>
    </footer>
  </main>

  <dialog id="lightbox" aria-label="大图预览">
    <button class="viewer-close" type="button" aria-label="关闭">×</button>
    <button class="nav prev" type="button" aria-label="上一个">‹</button>
    <div class="viewer" id="viewer"></div>
    <button class="nav next" type="button" aria-label="下一个">›</button>
    <div class="viewer-info" id="viewer-info"></div>
  </dialog>

  <script>
    const media = [
      ...Array.from({ length: 27 }, (_, i) => ({
        type: "photo",
        src: `assets/photo-${String(i + 1).padStart(2, "0")}.${[1, 23].includes(i + 1) ? "jpg" : "png"}`,
        title: `校园记忆 ${String(i + 1).padStart(2, "0")}`
      })),
      ...Array.from({ length: 4 }, (_, i) => ({
        type: "video",
        src: `assets/video-${String(i + 1).padStart(2, "0")}.mp4`,
        title: `动态片段 ${String(i + 1).padStart(2, "0")}`
      }))
    ];

    const gallery = document.querySelector("#gallery");
    const lightbox = document.querySelector("#lightbox");
    const viewer = document.querySelector("#viewer");
    const viewerInfo = document.querySelector("#viewer-info");
    let current = 0;
    let visible = media;

    function card(item, index) {
      const button = document.createElement("button");
      button.className = "card";
      button.type = "button";
      button.dataset.type = item.type;
      button.dataset.index = index;
      button.setAttribute("aria-label", `查看${item.title}`);
      const visual = item.type === "photo"
        ? `<img src="${item.src}" alt="${item.title}" loading="lazy" decoding="async">`
        : `<video src="${item.src}#t=0.1" muted preload="metadata" playsinline aria-label="${item.title}"></video><span class="play" aria-hidden="true">▶</span>`;
      button.innerHTML = `${visual}<span class="card-meta"><span>${item.title}</span><span class="kind">${item.type === "photo" ? "PHOTO" : "VIDEO"}</span></span>`;
      button.addEventListener("click", () => open(index));
      return button;
    }

    media.forEach((item, index) => gallery.append(card(item, index)));

    function open(index) {
      const absolute = media.indexOf(visible[index] ?? media[index]);
      current = absolute < 0 ? index : absolute;
      renderViewer();
      lightbox.showModal();
      document.body.style.overflow = "hidden";
    }

    function renderViewer() {
      const item = media[current];
      viewer.innerHTML = item.type === "photo"
        ? `<img src="${item.src}" alt="${item.title}">`
        : `<video src="${item.src}" controls autoplay playsinline aria-label="${item.title}"></video>`;
      viewerInfo.textContent = `${item.title} · ${current + 1} / ${media.length}`;
    }

    function move(step) {
      current = (current + step + media.length) % media.length;
      renderViewer();
    }

    function closeViewer() {
      const video = viewer.querySelector("video");
      if (video) video.pause();
      lightbox.close();
      document.body.style.overflow = "";
    }

    document.querySelector(".viewer-close").addEventListener("click", closeViewer);
    document.querySelector(".prev").addEventListener("click", () => move(-1));
    document.querySelector(".next").addEventListener("click", () => move(1));
    lightbox.addEventListener("click", event => { if (event.target === lightbox) closeViewer(); });
    lightbox.addEventListener("cancel", event => { event.preventDefault(); closeViewer(); });
    document.addEventListener("keydown", event => {
      if (!lightbox.open) return;
      if (event.key === "ArrowLeft") move(-1);
      if (event.key === "ArrowRight") move(1);
    });

    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelector(".filter.active").classList.remove("active");
        button.classList.add("active");
        const type = button.dataset.filter;
        visible = type === "all" ? media : media.filter(item => item.type === type);
        document.querySelectorAll(".card").forEach(card => {
          card.hidden = type !== "all" && card.dataset.type !== type;
        });
        document.querySelector("#visible-count").textContent = visible.length;
      });
    });
  </script>
</body>
</html>
